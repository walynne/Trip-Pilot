<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TripPilot AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            display: flex;
            height: calc(100vh - 80px);
        }

        .sidebar {

            width: 350px;

            background: white;

            border-right: 1px solid #ddd;

            overflow-y: auto;

            padding: 20px;
        }

        .main {

            flex: 1;

            display: flex;

            flex-direction: column;

            padding: 20px;
        }

        .chat-box {

            flex: 1;

            background: white;

            border-radius: 10px;

            padding: 15px;

            overflow-y: auto;

            border: 1px solid #ddd;
        }

        .message {

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 10px;

            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user {

            background: #dbeafe;
        }

        .agent {

            background: #dcfce7;
        }

        .formatted-message {

            white-space: normal;
        }

        .formatted-message h3 {

            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .formatted-message h4 {

            margin: 14px 0 8px 0;
            font-size: 15px;
        }

        .formatted-message ul {

            margin: 8px 0 12px 20px;
            padding: 0;
        }

        .formatted-message li {

            margin-bottom: 6px;
        }

        .formatted-message p {

            margin: 8px 0;
        }

        .recommendation-card {

            background: #f8fafc;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
        }

        .recommendation-layout {

            display: grid;
            gap: 12px;
        }

        .recommendation-section {

            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 14px;
        }

        .recommendation-section.primary {

            background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
            border-color: #93c5fd;
        }

        .recommendation-section h3,
        .recommendation-section h4 {

            margin: 0 0 10px 0;
        }

        .detail-grid {

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }

        .detail-item {

            background: #f8fafc;
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #e2e8f0;
        }

        .detail-label {

            display: block;
            font-size: 12px;
            color: #475569;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .detail-value {

            font-weight: 600;
            color: #0f172a;
            word-break: break-word;
        }

        .reason-list {

            margin: 0;
            padding-left: 18px;
        }

        .reason-list li {

            margin-bottom: 8px;
        }

        .input-bar {

            display: flex;

            gap: 10px;

            margin-top: 15px;
        }

        .input-bar input {

            flex: 1;

            padding: 12px;

            font-size: 14px;
        }

        .input-bar button {

            width: 120px;

            border: none;

            background: #2563eb;

            color: white;

            border-radius: 6px;

            cursor: pointer;
        }

        .section-title {

            margin-top: 20px;

            margin-bottom: 10px;
        }

        .step {

            background: #eff6ff;

            border-left: 4px solid #2563eb;

            border-radius: 6px;

            padding: 10px;

            margin-bottom: 8px;
        }

        .flight-card {

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 10px;

            margin-bottom: 10px;

            background: white;
        }

        .monitor-card {

            background: #fff7ed;

            border-left: 4px solid orange;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 10px;
        }

        .replan-card {

            background: #f0fdf4;

            border-left: 4px solid green;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 10px;
        }
        .alert-card {

    border-radius: 12px;

    padding: 16px;

    margin-bottom: 15px;

    background: #fff7ed;

    border-left: 5px solid #ea580c;
}

.alert-header {

    display: flex;

    align-items: center;

    gap: 10px;

    font-weight: bold;

    margin-bottom: 12px;
}

.alert-title {

    font-size: 16px;
}

.alert-type {

    color: #b45309;

    font-weight: bold;

    margin-bottom: 8px;
}

.alert-message {

    margin-bottom: 8px;
}

.alert-severity {

    color: red;

    font-weight: bold;
}

.rebook-card {

    background: #ecfdf5;

    border-left: 5px solid #16a34a;

    border-radius: 12px;

    padding: 16px;

    margin-bottom: 15px;
}

.rebook-header {

    font-weight: bold;

    color: #166534;

    margin-bottom: 10px;
}

.flight-option {

    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    padding: 12px;

    margin-bottom: 10px;
}

.flight-airline {

    font-weight: bold;

    color: #2563eb;
}

.flight-route {

    margin-top: 5px;

    color: #555;
}

.flight-price {

    margin-top: 8px;

    color: #16a34a;

    font-weight: bold;
}
        .controls {

            display: flex;

            gap: 10px;

            margin-top: 10px;
        }

        select {

            flex: 1;

            padding: 8px;
        }

        .control-button {

            padding: 10px;

            border: none;

            background: #dc2626;

            color: white;

            border-radius: 6px;

            cursor: pointer;
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        @media(max-width:900px) {

            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 350px;
            }
        }

    </style>

</head>

<body>

<div class="header">

    <h1>✈️ TripPilot AI Agent</h1>

</div>

<div class="container">

    <div class="sidebar">

        <h3>Agent Activity</h3>

        <div id="steps">

            <div class="step">
                Waiting for request...
            </div>

        </div>

        <h3 class="section-title">
            Flight Results
        </h3>

        <div id="flights"></div>

        <h3 class="section-title">
            Monitoring
        </h3>

        <div id="monitoring"></div>

        <h3 class="section-title">
            Replanning
        </h3>

        <div id="replanning"></div>

        <h3 class="section-title">
            Disruption Test
        </h3>

        <div class="controls">

            <select id="scenario">

                <option value="delay">
                    Flight Delay
                </option>

                <option value="cancel">
                    Flight Cancellation
                </option>

                <option value="weather">
                    Weather Disruption
                </option>

                <option value="policy">
                    Policy Violation
                </option>

            </select>

        </div>

        <div class="controls">

            <button
                class="control-button"
                onclick="simulateDisruption()">

                Simulate

            </button>

        </div>

    </div>

    <div class="main">

        <div
            class="chat-box"
            id="chatBox">

            <div class="message agent">
                👋 Welcome to TripPilot.

                Examples:

                Find me a flight from Hong Kong to Tokyo next week.

                Plan a trip to London under USD 2500.

                Can I travel business class?
            </div>

        </div>

        <div class="input-bar">

            <input
                type="text"
                id="message"
                placeholder="Ask TripPilot anything...">

            <button
                onclick="sendMessage()">

                Send

            </button>

        </div>

    </div>

</div>

<script>

window.currentTrip = null;

function addMessage(text, type) {

    const chatBox =
        document.getElementById(
            "chatBox"
        );

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " + type;


    if (type === "agent") {

        div.innerHTML = formatAgentMessage(text);
    } else {

        div.textContent =
            text;
    }

    chatBox.appendChild(div);

    chatBox.scrollTop =
        chatBox.scrollHeight;
}

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function formatInline(value) {

    return escapeHtml(value)
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
}

function formatAgentMessage(text) {

    const recommendationLayout =
        formatRecommendationLayout(text);

    if (recommendationLayout) {
        return recommendationLayout;
    }

    const lines = String(text || "")
        .split(/\r?\n/)
        .map(line => line.trimRight());

    let html = '<div class="formatted-message">';
    let inList = false;

    function closeList() {

        if (inList) {
            html += "</ul>";
            inList = false;
        }
    }

    lines.forEach((rawLine, index) => {

        const line = rawLine.trim();

        if (!line) {
            closeList();
            return;
        }

        if (line.startsWith("### ")) {
            closeList();
            html += `<h3>${formatInline(line.slice(4))}</h3>`;
            return;
        }

        if (
            line === "Recommended Flight" ||
            line === "Why" ||
            line === "Reason" ||
            line === "Business Impact" ||
            line === "Alternative Option" ||
            line === "Flight Details:"
        ) {
            closeList();

            const tag = index === 0 ? "h3" : "h4";
            html += `<${tag}>${formatInline(line)}</${tag}>`;
            return;
        }

        if (line.startsWith("- ")) {
            if (!inList) {
                html += '<ul class="recommendation-card">';
                inList = true;
            }

            html += `<li>${formatInline(line.slice(2))}</li>`;
            return;
        }

        if (/^\d+\.\s+/.test(line)) {
            if (!inList) {
                html += '<ul class="recommendation-card">';
                inList = true;
            }

            html += `<li>${formatInline(line.replace(/^\d+\.\s+/, ""))}</li>`;
            return;
        }

        closeList();
        html += `<p>${formatInline(line)}</p>`;
    });

    closeList();
    html += "</div>";

    return html;
}

function normalizeRecommendationText(text) {

    return String(text || "")
        .replace(/\s+/g, " ")
        .replace(/\s+->.*$/g, "")
        .replace(/Recommended Flight\s+\*\*Flight Details:\*\*/i, "Recommended Flight\nFlight Details:")
        .replace(/\*\*Flight Details:\*\*/g, "\nFlight Details:")
        .replace(/\s-\s\*\*/g, "\n- **")
        .replace(/\s(Reason|Why|Business Impact|Alternative Option)\s/g, "\n$1\n")
        .trim();
}

function extractDetailItems(block) {

    const items = [];
    const regex = /-\s*\*\*(.+?):\*\*\s*([\s\S]*?)(?=\n-\s*\*\*|\n(?:Reason|Why|Business Impact|Alternative Option)\n|$)/g;
    let match;

    while ((match = regex.exec(block)) !== null) {
        items.push({
            label: match[1].trim(),
            value: match[2].trim()
        });
    }

    return items;
}

function renderDetailGrid(items) {

    if (!items.length) {
        return "";
    }

    return `
        <div class="detail-grid">
            ${items.map(item => `
                <div class="detail-item">
                    <span class="detail-label">${escapeHtml(item.label)}</span>
                    <div class="detail-value">${formatInline(item.value)}</div>
                </div>
            `).join("")}
        </div>
    `;
}

function formatRecommendationLayout(text) {

    const normalized =
        normalizeRecommendationText(text);

    if (!/Recommended Flight/i.test(normalized)) {
        return "";
    }

    const detailsMatch = normalized.match(
        /Flight Details:\n([\s\S]*?)(?=\n(?:Reason|Why|Business Impact|Alternative Option)\n|$)/i
    );

    const reasonMatch = normalized.match(
        /(?:Reason|Why|Business Impact)\n([\s\S]*?)(?=\nAlternative Option\n|$)/i
    );

    const alternativeMatch = normalized.match(
        /Alternative Option\n([\s\S]*?)$/i
    );

    const detailItems = extractDetailItems(
        detailsMatch ? detailsMatch[1] : ""
    );

    const alternativeItems = extractDetailItems(
        alternativeMatch ? alternativeMatch[1] : ""
    );

    const reasons = (reasonMatch ? reasonMatch[1] : "")
        .split(/\n/)
        .map(line => line.trim())
        .filter(line => line)
        .map(line => line.replace(/^[-\d.\s]+/, "").trim());

    return `
        <div class="formatted-message recommendation-layout">
            <div class="recommendation-section primary">
                <h3>Recommended Flight</h3>
                ${renderDetailGrid(detailItems)}
            </div>
            ${reasons.length ? `
                <div class="recommendation-section">
                    <h4>Why this option</h4>
                    <ul class="reason-list">
                        ${reasons.map(reason => `<li>${formatInline(reason)}</li>`).join("")}
                    </ul>
                </div>
            ` : ""}
            ${alternativeItems.length ? `
                <div class="recommendation-section">
                    <h4>Alternative Option</h4>
                    ${renderDetailGrid(alternativeItems)}
                </div>
            ` : ""}
        </div>
    `;
}

async function sendMessage() {

    const input =
        document.getElementById(
            "message"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    addMessage(
        "👤 " + message,
        "user"
    );

    input.value = "";

    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );

        const data =
            await response.json();

        addMessage(
            "🤖 " +
            data.recommendation,
            "agent"
        );

        window.currentTrip =
            data.trip_details;

        renderSteps(
            data.agent_steps || []
        );

        renderFlights(
            data.flights || []
        );

    } catch (err) {

        addMessage(
            "Error calling server.",
            "agent"
        );
    }
}

function renderSteps(steps) {

    const div =
        document.getElementById(
            "steps"
        );

    div.innerHTML = "";

    steps.forEach(step => {

        div.innerHTML += `
            <div class="step">
                ✅ ${step}
            </div>
        `;
    });
}

function renderFlights(flights) {

    const div =
        document.getElementById(
            "flights"
        );

    div.innerHTML = "";

    flights.forEach(flight => {

        div.innerHTML += `

            <div class="flight-card">

                <strong>
                    ${flight.airline || ""}
                </strong>

                <br><br>

                Price:
                ${flight.price || ""}
                ${flight.currency || ""}

                <br>

                Stops:
                ${flight.stops || 0}

                <br>

                ${flight.origin || ""}
                →
                ${flight.destination || ""}

            </div>
        `;
    });
}

function renderAlternativeFlights(
    flights
){

    const div =
        document.getElementById(
            "alternativeFlights"
        );

    div.innerHTML = "";

    flights.forEach(flight => {

        div.innerHTML += `

        <div class="flight-option">

            <div class="flight-airline">

                ✈ ${flight.airline}

            </div>

            <div class="flight-route">

                ${flight.origin}
                →
                ${flight.destination}

            </div>

            <div class="flight-price">

                ${flight.currency}
                ${flight.price}

            </div>

            <div>

                Stops:
                ${flight.stops}
            </div>

        </div>

        `;
    });
}

async function simulateDisruption() {

    if (!window.currentTrip) {

        alert(
            "Search a trip first."
        );

        return;
    }

    const scenario =
        document.getElementById(
            "scenario"
        ).value;

    const response =
        await fetch(
            "/simulate-disruption",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                    trip:
                        window.currentTrip,

                    scenario:
                        scenario
                })
            }
        );

    const data =
        await response.json();

    document.getElementById(
    "monitoring"
).innerHTML = `

<div class="alert-card high">

    <div class="alert-header">

        <span class="alert-icon">
            ⚠️
        </span>

        <span class="alert-title">
            Flight Disruption Detected
        </span>

    </div>

    <div class="alert-body">

        <div class="alert-type">
            FLIGHT DELAY
        </div>

        <div class="alert-message">
            Flight delayed by 6 hours
        </div>

        <div class="alert-severity">
            Severity: HIGH
        </div>

    </div>

</div>

`;

    if (data.replan_result) {

    document.getElementById(
    "replanning"
).innerHTML = `

<div class="rebook-card">

    <div class="rebook-header">

        ✅ Rebooking Recommendation

    </div>

    <div class="rebook-body">

        ${formatAgentMessage(data.replan_result.recommendation)}

    </div>

</div>

`;

    renderAlternativeFlights(
        data.replan_result.alternative_flights || []
    );
}
}

document
    .getElementById(
        "message"
    )
    .addEventListener(
        "keypress",
        function(event) {

            if (
                event.key === "Enter"
            ) {
                sendMessage();
            }
        }
    );

</script>

</body>

</html>
