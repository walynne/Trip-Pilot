name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8.4.2' 'requests==2.32.5' 'openai>=1.100.0' 'python-dotenv==1.1.1'
      - name: Check Python syntax
        run: python -m compileall -q app.py agents services tools rag scripts tests
      # - name: Run offline tests
      #   run: python -m pytest -q
